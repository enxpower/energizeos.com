name: Validate site

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  social-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify reviewed English editions and generated output
        run: |
          python3 scripts/english_editions.py --baseline origin/main --render . --check-tracked
          git diff --exit-code -- insights sitemap.xml
      - name: Validate sharing metadata and assets
        run: python scripts/validate_social_preview.py
      - name: Verify publication regression fixtures
        run: python3 -m unittest discover -s scripts/tests -p "test_*.py"
      - name: Validate English Insights and publishing isolation
        run: python scripts/validate_insights.py
      - name: Audit the complete official website against technical AdSense preflight
        run: |
          python3 scripts/audit_adsense_preflight.py --self-test
          python scripts/audit_adsense_preflight.py . --domain energizeos.com
      - name: Reject internal editorial process language in public site
        run: |
          python scripts/public_copy_gate.py --self-test
          python scripts/public_copy_gate.py .

      - name: Set up Node for browser acceptance
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Chromium for layout review
        run: |
          npm install --no-save --no-package-lock --ignore-scripts playwright@1.62.1
          npx playwright install --with-deps chromium
      - name: Verify responsive 390 / 768 / 1440 pixel layouts
        run: |
          python -m http.server 8766 --bind 127.0.0.1 >/tmp/esi-insights-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          node scripts/audit_insights.mjs
          node scripts/audit_editions.mjs http://127.0.0.1:8766
      - name: Retain independent visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: esi-insights-browser-snapshots
          path: build/visual/
          if-no-files-found: ignore
          retention-days: 7

