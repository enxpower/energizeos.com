name: Sync public optical intelligence issue archive

on:
  schedule:
    - cron: "35 14 * * 1,2"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: optical-public-issue-manifest
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Fetch and validate only public optical issue metadata
        run: python3 scripts/sync_public_intelligence_issues.py optical insights/public-optical-issues.json
      - name: Commit only changed public manifest
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- insights/public-optical-issues.json
          if git diff --cached --quiet; then
            echo "No new verified public edition; leaving publication unchanged."
            exit 0
          fi
          git commit -m "chore(insights): synchronize verified optical weekly editions"
          git push
