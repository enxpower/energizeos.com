name: Verify live English Insights

on:
  pull_request:
    paths:
      - ".github/workflows/insights-live-smoke.yml"
      - "docs/VERIFIED_WORKING_STATE.md"
  push:
    branches: [main]
  schedule:
    - cron: "47 11 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-public-route:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify HTTPS, page identity, English and canonical
        env:
          INSIGHTS_URL: "https://energizeos.com/insights/"
          CONTENT_MARKER: "What does an optical link budget actually tell you?"
        run: |
          python3 - <<'PY'
          import os
          import re
          import time
          import urllib.error
          import urllib.request

          url = os.environ["INSIGHTS_URL"]
          marker = os.environ["CONTENT_MARKER"]
          last_error = None
          for attempt in range(1, 4):
              try:
                  request = urllib.request.Request(
                      url,
                      headers={"User-Agent": "AGIM-ESI-ReadOnly-Insights-Site-Check/1.0"},
                  )
                  with urllib.request.urlopen(request, timeout=20) as response:
                      status = response.status
                      resolved = response.geturl()
                      body = response.read(500_000).decode("utf-8", errors="strict")
                  if status != 200 or resolved.rstrip("/") != url.rstrip("/"):
                      raise AssertionError(f"Unexpected HTTP status/redirect: {status} {resolved}")
                  if '<html lang="en">' not in body:
                      raise AssertionError("English HTML language tag missing")
                  if marker not in body:
                      raise AssertionError("Expected original engineering reference missing")
                  if f'href="{url}"' not in body:
                      raise AssertionError("Expected canonical Insights URL missing")
                  if re.search(r"[\u3400-\u9fff]", body):
                      raise AssertionError("Non-English CJK content found on public page")
                  print(f"PUBLIC_INSIGHTS_HTTP_VERIFIED URL={url} STATUS=200")
                  break
              except Exception as exc:
                  last_error = exc
                  print(f"Live acceptance attempt {attempt} failed: {type(exc).__name__}: {exc}")
                  if attempt < 3:
                      time.sleep(6)
          else:
              raise SystemExit(f"PUBLIC_INSIGHTS_HTTP_NOT_VERIFIED: {last_error}")
          PY

      - name: Verify live original engineering tools and script
        env:
          TOOL_URL: "https://energizeos.com/insights/tools/"
          TOOL_ASSET: "https://energizeos.com/insights/assets/engineering-tools.js"
          TOOL_MARKER: "Optical Link Budget Calculator"
          SCRIPT_MARKER: 'connect("dispatch")'
        run: |
          python3 - <<'PY'
          import os
          import time
          import urllib.request

          def fetch(url):
              last_error = None
              for attempt in range(3):
                  try:
                      req = urllib.request.Request(url, headers={"User-Agent": "AGIM-ESI-Public-Engineering-Acceptance/1.0"})
                      with urllib.request.urlopen(req, timeout=20) as response:
                          if response.status != 200:
                              raise AssertionError(f"Unexpected HTTP status {response.status}")
                          if response.geturl().rstrip("/") != url.rstrip("/"):
                              raise AssertionError("Unexpected redirect")
                          return response.read(500000).decode("utf-8", errors="strict")
                  except Exception as error:
                      last_error = error
                      if attempt < 2:
                          time.sleep(5)
              raise AssertionError(f"Live public resource unavailable: {url}: {last_error}")

          page_url = os.environ["TOOL_URL"]
          page = fetch(page_url)
          script = fetch(os.environ["TOOL_ASSET"])
          if '<html lang="en">' not in page or f'href="{page_url}"' not in page:
              raise AssertionError("Missing English declaration or expected canonical")
          if os.environ["TOOL_MARKER"] not in page:
              raise AssertionError("Expected engineering calculator was not deployed")
          if os.environ["SCRIPT_MARKER"] not in script:
              raise AssertionError("Live calculation script does not match the tested tool")
          if "adsbygoogle" in page.lower():
              raise AssertionError("Unexpected advertising code")
          print(f"PUBLIC_ENGINEERING_TOOL_VERIFIED URL={page_url} STATUS=200 SCRIPT=200")
          PY
